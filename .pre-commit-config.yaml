repos:
- repo: https://github.com/codespell-project/codespell
  rev: 57b21406f092110c18776e39b0bda50d37c945c8  # frozen: v2.4.3
  hooks:
  - id: codespell
    args: ["--ignore-words=ignore_words.txt"]

- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: f368fb366ff7f2f808dd324b83a6d32267799e19  # frozen: v0.17.2
  hooks:
    - id: ruff-check
    - id: ruff-format

- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
  exclude: tests/test_table_writer.py
  hooks:
  - id: check-merge-conflict
    exclude: tests/test_table_writer.py
  - id: debug-statements
    exclude: tests/test_table_writer.py
  - id: check-yaml
    exclude: tests/test_table_writer.py
  - id: trailing-whitespace
    exclude: tests/test_table_writer.py


- repo: https://github.com/asottile/blacken-docs
  rev: dda8db18cfc68df532abf33b185ecd12d5b7b326  # frozen: 1.20.0
  hooks:
  -   id: blacken-docs
      additional_dependencies: [black==26.10.1]

- repo: https://github.com/ansys/pre-commit-hooks
  rev: 55c5b6a5439abd847613579c6924da750e8b78b2  # frozen: v0.8.0
  hooks:
  - id: add-license-headers
    exclude: ^tests/assets/.*$
    args:
    - --start_year=2022

- repo: https://github.com/zizmorcore/zizmor-pre-commit
  rev: c92afdf2c6ca336aaa8f39e2bd8d48f62dbd8e1f  # frozen: v1.31.1
  hooks:
    - id: zizmor