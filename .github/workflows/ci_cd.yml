# check spelling, codestyle
name: GitHub CI

# run only on main branch.  This avoids duplicated actions on PRs
on:
  pull_request:
  push:
    tags:
      - "*"
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {} # Disable default permissions

# Define the environment
env:
  MAIN_PYTHON_VERSION: 3.14
  LIBRARY_NAME: hollerith
  DOCUMENTATION_CNAME: hollerith.docs.pyansys.com

jobs:
  code-style:
    name: "Code style"
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to checkout code
    steps:
      - name: "Run code style checks"
        uses: ansys/actions/code-style@84b6533ae76f5dde69a1df26c18682160a8121cf # v10.3.5
        with:
          python-version: ${{ env.MAIN_PYTHON_VERSION }}
          use-python-cache: false

  check-vulnerabilities:
    name: Vulnerabilities
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to checkout code
    steps:
      - uses: ansys/actions/check-vulnerabilities@84b6533ae76f5dde69a1df26c18682160a8121cf # v10.3.5
        with:
          python-version: ${{ env.MAIN_PYTHON_VERSION }}
          python-package-name: ${{ env.LIBRARY_NAME }}
          token: ${{ secrets.PYANSYS_CI_BOT_TOKEN }}
          dev-mode: ${{ github.ref != 'refs/heads/main' }}

  actions-security:
    name: Actions Security
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to checkout code
    steps:
      - uses: ansys/actions/check-actions-security@84b6533ae76f5dde69a1df26c18682160a8121cf # v10.3.5
        with:
          generate-summary: true
          token: ${{ secrets.GITHUB_TOKEN }}
          auditing-level: 'high'

  pr-name:
    if: github.event_name == 'pull_request'
    name: Check the name of the PR
    permissions:
      contents: read # Required to checkout code
    runs-on: ubuntu-latest
    steps:
      - name: Check commit name
        uses: ansys/actions/check-pr-title@84b6533ae76f5dde69a1df26c18682160a8121cf # v10.3.5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build package on ${{ matrix.os }} with Python ${{ matrix.cfg.python-version }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read # Required to checkout code
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        cibw_archs: ["auto"]
        cfg:
          - {python-version: '3.10', cibw-build: 'cp310-*'}
          - {python-version: '3.11', cibw-build: 'cp311-*'}
          - {python-version: '3.12', cibw-build: 'cp312-*'}
          - {python-version: '3.13', cibw-build: 'cp313-*'}
          - {python-version: '3.14', cibw-build: 'cp314-*', cibw_archs: 'x64'}
        should-release:
          - ${{ github.event_name == 'push' && contains(github.ref, 'refs/tags') }}
        exclude:
          - should-release: false
            os: macos-latest
    steps:
      - name: Create wheel for CPython ${{ matrix.cfg.python-version }}
        uses: ansys/actions/build-ci-wheels@84b6533ae76f5dde69a1df26c18682160a8121cf # v10.3.5
        with:
          python-version: ${{ matrix.cfg.python-version }}
          cibw-build: ${{ matrix.cfg.cibw-build }}
          cibw-archs: ${{ matrix.cibw_archs }}
          operating-system: ${{ matrix.os }}
          library-name: ${{ env.LIBRARY_NAME }}

  tests:
    name: Testing
    needs: [build, code-style]
    permissions:
      contents: read # Required to checkout code
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        os: [ubuntu-latest, windows-latest]
        numpy-version: ['1.26.4', 'latest']
        exclude:
          - python-version: '3.13'
            numpy-version: '1.26.4'
          - python-version: '3.14'
            numpy-version: '1.26.4'
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}

      - name: Create Linux wheel
        run: |
          pip install build
          python -m build --wheel

      - name: Validate wheel
        run: |
          pip install twine
          twine check dist/*

      - name: Install library on Linux
        if: ${{ runner.os == 'Linux' }}
        run: pip install $(echo dist/*)

      - name: Install library on Windows
        if: ${{ runner.os == 'Windows' }}
        run: pip install (get-item .\dist\*.whl)

      - name: Install Numpy old version
        if: ${{ matrix.numpy-version != 'latest' }}
        # zizmor: ignore[template-injection] - matrix values are controlled and not user input
        run: pip install numpy==${{ matrix.numpy-version }}

      - name: Install Numpy latest version
        if: ${{ matrix.numpy-version == 'latest' }}
        run: pip install numpy --upgrade --force-reinstall

      - name: Unit testing
        run: |
          pip install -r requirements/requirements_test.txt
          cd tests  # so we're testing the install, not local
          pytest -svx

      - name: Build sdist
        run: |
          pip install build
          python -m build -s

      - name: Check metadata
        run: |
          pip install twine
          twine check dist/*

      - name: Upload wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ runner.os == 'Linux' && env.MAIN_PYTHON_VERSION == matrix.python-version && matrix.numpy-version == 'latest' }}
        with:
          name: ${{ env.LIBRARY_NAME }}-sdist
          path: dist/*.tar.gz
          retention-days: 7

  compile-wheels:
    name: "Join all wheels into a single artifact"
    needs: [tests]
    permissions:
      contents: read # Required to checkout code
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1

      - name: Find all wheels and source distributions
        run: |
          mkdir -p dist
          find . -name "*.whl" -exec cp {} dist/ \;
          find . -name "*.tar.gz" -exec cp {} dist/ \;

      - name: List contents of dist
        run: ls dist

      - name: Upload all wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.LIBRARY_NAME }}-artifacts
          path: dist/*
          retention-days: 7

  doc-build:
    name: "Build documentation"
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to checkout code
    steps:
      - uses: ansys/actions/doc-build@84b6533ae76f5dde69a1df26c18682160a8121cf # v10.3.5
        with:
          python-version: ${{ env.MAIN_PYTHON_VERSION }}


  release:
    name: Release project
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags')
    needs: [compile-wheels, doc-build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required to authenticate with PyPI via trusted publishing
      contents: write  # Required to upload release artifacts
    steps:
      - name: "Download the library artifacts from build-library step"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.LIBRARY_NAME }}-artifacts
          path: ${{ env.LIBRARY_NAME }}-artifacts

      - name: "Upload artifacts to PyPI using trusted publisher"
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
        with:
          repository-url: "https://upload.pypi.org/legacy/"
          print-hash: true
          packages-dir: ${{ env.LIBRARY_NAME }}-artifacts
          skip-existing: false

      - name: "Release to GitHub"
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.0 # zizmor: ignore[superfluous-actions]
        with:
          generate_release_notes: true
          files: |
            ./**/*.whl
            ./**/*.tar.gz


  upload_dev_docs:
    name: Upload dev documentation
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [doc-build]
    steps:
      - name: Deploy the latest documentation
        uses: ansys/actions/doc-deploy-dev@84b6533ae76f5dde69a1df26c18682160a8121cf # v10.3.5
        with:
          cname: ${{ env.DOCUMENTATION_CNAME }}
          token: ${{ secrets.PYANSYS_CI_BOT_TOKEN }}
          bot-user: ${{ secrets.PYANSYS_CI_BOT_USERNAME }}
          bot-email: ${{ secrets.PYANSYS_CI_BOT_EMAIL }}

  upload_docs_release:
    name: Upload release documentation
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags')
    runs-on: ubuntu-latest
    needs: [release]
    steps:
      - name: Deploy the stable documentation
        uses: ansys/actions/doc-deploy-stable@84b6533ae76f5dde69a1df26c18682160a8121cf # v10.3.5
        with:
          cname: ${{ env.DOCUMENTATION_CNAME }}
          token: ${{ secrets.PYANSYS_CI_BOT_TOKEN }}
          bot-user: ${{ secrets.PYANSYS_CI_BOT_USERNAME }}
          bot-email: ${{ secrets.PYANSYS_CI_BOT_EMAIL }}
